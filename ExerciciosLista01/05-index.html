<head>
    <meta charset="UTF-8">
    <title>Formulário de Cadastro</title>
    <link rel="stylesheet" href="05-style.css">
</head>

<body>
    <header>
        <h1>05 - Lista de tarefas</h1>
    </header>

    <section id ="secAdd">
        <h2>Adicionar tarefa</h2>
        <input type="text" id="txtTarefa" placeholder="Digite a tarefa...">
        <button id="btnAdd">Salvar</button>
        <p id="msgFeedback"></p>
        
    </section>


    <section id="secList" class="hidden">
        <h2>Lista de tarefas</h2>
        <button id="btnListarTarefas">Listar tarefas</button>
        <ul id="listar"></ul>
    </section>

    <script src="05-script.js" defer> </script>
</body>
