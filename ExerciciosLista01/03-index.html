<head>
    <meta charset="UTF-8">
    <title>Formulário de Cadastro</title>
    <link rel="stylesheet" href="03-style.css">
</head>

<body>
    <header>
    <h1>03 - Calculadora de média</h1>
    </header>

    <main>
    <section>
        <p>
            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" name="nota1" required placeholder="Digite a primeira nota"></input>
        </p>

        <p>
            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" name="nota2" required placeholder="Digite a segunda nota"></input>
        </p>

        <p>
            <label for="nota3">Nota 3:</label>
            <input type="number" id="nota3" name="nota3" required placeholder="Digite a terceira nota"></input>
        </p>

        <!-- 1. Botão que chama a função do JS -->
        <button onclick="calcularMedia()">Calcular Média</button>
        <h2 id="resultado"></h2>

        <script src="03-script.js" defer> </script>
    </section>
    </main>

</body>
